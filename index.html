function kpi(label,val,delta,kind='currency',hint=''){let display=kind==='percent'?pct(val):kind==='count'?String(val):money(val);return `<div class="kpi"><div class="label" title="${esc(hint)}">${label}</div><div class="value ${val<0?'neg':''}">${display}</div><div class="delta ${delta?.cls||'muted'}">${delta?.text||''}</div></div>`}

function svgBars(items,{diverging=false,color='#006b3f'}={}){if(!items.length)return `<div class="empty">Không có dữ liệu để hiển thị.</div>`;let W=820,row=34,H=items.length*row+35,left=210,right=70,vals=items.map(x=>x.value||0),min=diverging?Math.min(0,...vals):0,max=Math.max(0,...vals),range=max-min||1,zero=left+(0-min)/range*(W-left-right);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="${zero}" y1="8" x2="${zero}" y2="${H-20}" stroke="#435148" stroke-width="1.2"/>`;items.forEach((x,i)=>{let y=12+i*row,v=x.value||0,xv=left+(v-min)/range*(W-left-right),barx=Math.min(zero,xv),bw=Math.max(1,Math.abs(xv-zero)),c=v<0?'#b8323a':x.color||color;s+=`<text x="${left-8}" y="${y+15}" text-anchor="end" font-size="11" fill="#435148">${esc(x.label.length>27?x.label.slice(0,26)+'…':x.label)}</text><rect x="${barx}" y="${y}" width="${bw}" height="20" rx="3" fill="${c}"><title>${esc(x.label)}: ${money(v)} ${unitLabel()}</title></rect><text x="${v>=0?xv+6:xv-6}" y="${y+15}" text-anchor="${v>=0?'start':'end'}" font-size="10" fill="${c}">${money(v)}</text>`});return s+'</svg>'}
function waterfall(rec){if(!rec)return '<div class="empty">Không có dữ liệu.</div>';let steps=[['Doanh thu',rec.revenue,'total'],['Giá vốn',-(rec.cogs||0),'delta'],['Lợi nhuận gộp',rec.grossProfit,'total'],['Chi phí QL',-(rec.adminCost||0),'delta'],['KQ tài chính',(rec.financeRevenue||0)-(rec.financeCost||0),'delta'],['Thu nhập/CP khác',(rec.otherIncome||0)-(rec.otherCost||0)+(rec.allocation||0),'delta'],['LNTT',rec.pbt,'total'],['LNST',rec.pat,'total']];let W=860,H=270,p=40,max=Math.max(...steps.map(x=>Math.abs(x[1]||0)),1),base=H-45,scale=(H-85)/(max*2),zero=base-max*scale;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="30" y1="${zero}" x2="${W-20}" y2="${zero}" stroke="#435148"/>`;let bw=64,gap=35;steps.forEach((st,i)=>{let v=st[1]||0,x=35+i*(bw+gap),h=Math.abs(v)*scale,y=v>=0?zero-h:zero,c=st[2]==='total'?'#006b3f':v>=0?'#087443':'#b8323a';s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="3" fill="${c}"><title>${st[0]}: ${money(v)} ${unitLabel()}</title></rect><text x="${x+bw/2}" y="${base+18}" text-anchor="middle" font-size="9" fill="#617067">${st[0]}</text>`});return s+'</svg>'}
function unitRows(metric='pat'){return ['Hạ Long All','Phú Quốc All','Chi phí chung HO','TTTM Syrena','Central Avenue','Vận hành/Thanh Phú 85ha'].map(n=>({label:n,value:P(n)?.[metric]??0}))}
function insights(name){let a=P(name),b=P(name,'T5/2026');if(!a)return '';let dr=fmtDelta(a.revenue,b?.revenue,'up'),dc=fmtDelta(a.cogs,b?.cogs,'down');let children=Object.values(D.entities).filter(x=>x.parent===name&&P(x.name));let worst=children.sort((x,y)=>(P(x.name)?.pat||0)-(P(y.name)?.pat||0))[0];return `<div class="insight"><b>Điểm tích cực</b>${dr.cls==='pos'?'Doanh thu cải thiện '+dr.text.toLowerCase()+'.':'Phú Quốc All và TTTM Syrena đang tạo lợi nhuận dương trong T6.'}</div><div class="insight bad"><b>Rủi ro chính</b>${a.pat<0?`Kết quả sau thuế đang lỗ ${money(Math.abs(a.pat))} ${unitLabel()}.`:'Theo dõi tốc độ tăng giá vốn so với doanh thu.'}</div><div class="insight warnbox"><b>Ưu tiên quản trị</b>${worst?`Rà soát ${esc(worst.name)}, đang tác động ${money(P(worst.name).pat)} ${unitLabel()} vào kết quả.`:`Giá vốn ${dc.text.toLowerCase()}; cần kiểm soát các nhóm chi phí lớn.`}</div>`}

function trendExecutiveChart(){let periods=['T5/2026','T6/2026','T5+T6/2026'];let labels=['T5','T6','T5+T6'];let data=periods.map(p=>P(state.entity,p)||P('Toàn Công ty',p));let W=900,H=300,left=62,right=28,top=24,bottom=48;let vals=[];data.forEach(d=>vals.push(d?.revenue||0,d?.cogs||0,Math.abs(d?.pat||0)));let max=Math.max(...vals,1),plot=H-top-bottom,step=(W-left-right)/3,scale=v=>(H-bottom)-(Math.abs(v)/max)*plot;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="${left}" y1="${H-bottom}" x2="${W-right}" y2="${H-bottom}" stroke="#9aa79f"/>`;let points=[];labels.forEach((l,i)=>{let d=data[i]||{},cx=left+i*step+step/2,bw=42,gap=10,rh=(d.revenue||0)/max*plot,ch=(d.cogs||0)/max*plot,py=scale(d.pat||0);s+=`<rect x="${cx-bw-gap/2}" y="${H-bottom-rh}" width="${bw}" height="${Math.max(1,rh)}" rx="6" fill="#087443"><title>Doanh thu ${l}: ${money(d.revenue||0)} ${unitLabel()}</title></rect><rect x="${cx+gap/2}" y="${H-bottom-ch}" width="${bw}" height="${Math.max(1,ch)}" rx="6" fill="#c4932b"><title>Giá vốn ${l}: ${money(d.cogs||0)} ${unitLabel()}</title></rect><text x="${cx}" y="${H-18}" text-anchor="middle" font-size="11" font-weight="700" fill="#435148">${l}</text>`;points.push(`${cx},${py}`)});s+=`<polyline points="${points.join(' ')}" fill="none" stroke="#b8323a" stroke-width="3"/>`;points.forEach((p,i)=>{let [x,y]=p.split(',');s+=`<circle cx="${x}" cy="${y}" r="5" fill="#b8323a"><title>Độ lớn LNST ${labels[i]}: ${money(Math.abs(data[i]?.pat||0))} ${unitLabel()} (${(data[i]?.pat||0)<0?'lỗ':'lãi'})</title></circle>`});return s+'</svg>'}
const MAJOR_UNITS=['Hạ Long All','Phú Quốc All','Chi phí chung HO','TTTM Syrena','Central Avenue','Vận hành/Thanh Phú 85ha'];
function periodRecord(name,p=state.period){let r=P(name,p);if(r)return r;if(p==='T5+T6/2026'){let a=P(name,'T5/2026'),b=P(name,'T6/2026');if(a||b){let keys=Object.keys(D.metrics),z={};keys.forEach(k=>z[k]=(a?.[k]||0)+(b?.[k]||0));z.grossMargin=z.revenue?z.grossProfit/z.revenue:null;return z}}return null}
function majorUnitItems(metric,color){return MAJOR_UNITS.map(n=>({label:n,value:periodRecord(n)?.[metric]||0,color}))}
function visibleRevenueChildren(){let types=['project','other-revenue','cost-center','shared-infrastructure'];let all=Object.values(D.entities).filter(x=>types.includes(x.type));if(state.entity==='Toàn Công ty')return all;if(D.groups[state.entity])return all.filter(x=>x.parent===state.entity);return all.filter(x=>x.parent===state.entity)}
function pnlExecutiveInsights(){let r=periodRecord('Toàn Công ty'),units=MAJOR_UNITS.map(n=>({name:n,r:periodRecord(n)})).filter(x=>x.r),best=[...units].sort((a,b)=>(b.r.pat||0)-(a.r.pat||0))[0],worst=[...units].sort((a,b)=>(a.r.pat||0)-(b.r.pat||0))[0],ratio=r?.revenue?(r.cogs||0)/r.revenue:null;return `<div class="exec-note-grid"><div class="exec-note"><b>Kết quả toàn Công ty</b>${r?.pat<0?'LNST đang lỗ '+money(Math.abs(r.pat))+' '+unitLabel():'LNST đạt '+money(r?.pat||0)+' '+unitLabel()} trong ${state.period}.</div><div class="exec-note"><b>Đơn vị đóng góp tốt nhất</b>${esc(best?.name||'N/A')}: ${money(best?.r?.pat||0)} ${unitLabel()}.</div><div class="exec-note"><b>Ưu tiên kiểm soát</b>${esc(worst?.name||'N/A')}: ${money(worst?.r?.pat||0)} ${unitLabel()}; giá vốn/doanh thu toàn Công ty ${pct(ratio)}.</div></div>`}
function overviewProjectPool(){let allowed=['project','cost-center','shared-infrastructure','other-revenue'];let pool=Object.values(D.entities).filter(x=>allowed.includes(x.type));if(state.entity==='Toàn Công ty')return pool;if(D.groups[state.entity])return pool.filter(x=>x.parent===state.entity);return pool.filter(x=>x.parent===state.entity||x.name===state.entity)}
function projectPeriodValue(name,key){let r=P(name);if(r&&r[key]!=null)return r[key];if(state.period==='T5+T6/2026'){let a=P(name,'T5/2026'),b=P(name,'T6/2026');if(a||b)return (a?.[key]||0)+(b?.[key]||0)}return 0}
function projectMetricChart(key,color){let items=overviewProjectPool().map(x=>({label:x.name,value:projectPeriodValue(x.name,key),color})).filter(x=>x.value!==0).sort((a,b)=>Math.abs(b.value)-Math.abs(a.value)).slice(0,15);return svgBars(items,{diverging:items.some(x=>x.value<0),color})}
function profitUnitAxis(){let items=unitRows('pat').sort((a,b)=>b.value-a.value);let W=920,row=42,H=items.length*row+48,left=250,right=110,vals=items.map(x=>x.value||0),min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1,zero=left+(0-min)/range*(W-left-right),s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><line x1="${zero}" y1="8" x2="${zero}" y2="${H-24}" stroke="#25382d" stroke-width="2"/><text x="${zero}" y="${H-7}" text-anchor="middle" font-size="10" font-weight="700" fill="#25382d">0</text>`;items.forEach((x,i)=>{let y=12+i*row,v=x.value||0,xv=left+(v-min)/range*(W-left-right),bx=Math.min(zero,xv),bw=Math.max(2,Math.abs(xv-zero)),c=v<0?'#b8323a':'#087443';s+=`<text x="${left-10}" y="${y+18}" text-anchor="end" font-size="11" fill="#435148">${esc(x.label)}</text><rect x="${bx}" y="${y}" width="${bw}" height="24" rx="5" fill="${c}"><title>${esc(x.label)}: ${money(v)} ${unitLabel()}</title></rect><text x="${v>=0?xv+7:xv-7}" y="${y+17}" text-anchor="${v>=0?'start':'end'}" font-size="10" font-weight="700" fill="${c}">${money(v)}</text>`});return s+'</svg>'}

function vndFull(v){if(v==null)return '-';let n=Number(v);if(!isFinite(n)||Math.abs(n)<.0000001)return '-';let text=Math.abs(n).toLocaleString('vi-VN',{maximumFractionDigits:0});return n<0?'('+text+')':text}

function kqkdSummary(){let t5=P('Toàn Công ty','T5/2026'),t6=P('Toàn Công ty','T6/2026'),lk=P('Toàn Công ty','T5+T6/2026');if(!t5||!t6||!lk)return '<div class="empty">Không có đủ dữ liệu T5, T6 và lũy kế.</div>';let rows=[{section:'I. TỔNG DOANH THU'},{no:'1.1',label:'Doanh thu phí quản lý',a:6153978740,b:8056533224,c:14210511964},{no:'1.2',label:'Doanh thu khác',a:892943515,b:1349839450,c:2242782965},{no:'1.3',label:'Doanh thu khu vực HTC phân bổ',a:0,b:0,c:0},{label:'CỘNG DOANH THU',a:t5.revenue,b:t6.revenue,c:lk.revenue,total:true},{section:'II. GIÁ VỐN (CHI PHÍ HOẠT ĐỘNG)'},{no:'1',label:'Chi phí nhân sự',key:'personnel'},{no:'2',label:'Vật tư tiêu hao',key:'materials'},{no:'3',label:'Công cụ dụng cụ (CCDC)',key:'tools'},{no:'4',label:'Dịch vụ mua ngoài (DVMN)',key:'services'},{no:'5',label:'Chi phí năng lượng',key:'energy'},{label:'CỘNG GIÁ VỐN',key:'cogs',total:true},{label:'LỢI NHUẬN GỘP (= Doanh thu - Giá vốn)',key:'grossProfit',total:true,profit:true},{label:'Tỷ lệ lãi gộp (%)',key:'grossMargin',percent:true,profit:true},{section:'CÁC KHOẢN MỤC KHÁC'},{no:'III',label:'Doanh thu hoạt động tài chính',key:'financeRevenue'},{no:'IV',label:'Chi phí tài chính',key:'financeCost'},{no:'V',label:'Chi phí bán hàng',key:'sellingCost'},{no:'VI',label:'Chi phí quản lý',key:'adminCost'},{no:'VII',label:'Thu nhập khác',key:'otherIncome'},{no:'VIII',label:'Chi phí khác',key:'otherCost'},{no:'IX',label:'Phân bổ chi phí HT chung vào các dự án TP',key:'allocation'},{label:'TỔNG LỢI NHUẬN KẾ TOÁN TRƯỚC THUẾ',key:'pbt',total:true,profit:true},{no:'X',label:'Chi phí thuế TNDN hiện hành',key:'tax'},{label:'LỢI NHUẬN SAU THUẾ TNDN',key:'pat',total:true,final:true}];let activeCol=state.period==='T5/2026'?2:state.period==='T6/2026'?3:4;let body=rows.map(r=>{if(r.section)return `<tr class="kqkd-section"><td></td><td colspan="6"><span class="kqkd-section-label">${r.section}</span></td></tr>`;let a=r.key!=null?t5[r.key]:r.a,b=r.key!=null?t6[r.key]:r.b,c=r.key!=null?lk[r.key]:r.c,d=(b|| function project(){let n=state.project,E0=E(n),a=P(n),b=P(n,'T5/2026');if(!E0||!a)return pageHead('Chi tiết dự án','')+'<div class="empty">Không có dữ liệu cho dự án này.</div>';let keys=['revenue','personnel','materials','tools','services','energy','cogs','grossProfit','grossMargin','financeRevenue','financeCost','adminCost','otherIncome','otherCost','pbt','pat'];let rows=keys.map(k=>{let meta=D.metrics[k],x=a[k],y=b?.[k],isPct=meta.format==='percent',delta=x!=null&&y!=null?(isPct?((x-y)*100).toLocaleString('vi-VN',{maximumFractionDigits:1})+' điểm %':money(x-y)):'Chưa có dữ liệu';return `<tr><td>${meta.label}</td><td class="num ${x<0?'neg':''}">${isPct?pct(x):money(x)}</td><td class="num ${y<0?'neg':''}">${isPct?pct(y):money(y)}</td><td class="num ${isPct?'':(x-y)<0?'neg':'pos'}">${delta}</td></tr>`}).join('');let breakdown=[a.personnel,a.materials,a.tools,a.services,a.energy].some(v=>v!=null&&v!==0);return pageHead(n,`${E0.type} · ${E0.parent||'Toàn Công ty'}`)+kpiSet(n)+`<div class="grid"><section class="card span7"><h2>So sánh T5 và ${state.period}</h2>${svgBars([{label:'Doanh thu T5',value:b?.revenue||0,color:'#a5afa9'},{label:'Doanh thu hiện tại',value:a.revenue||0},{label:'Giá vốn hiện tại',value:a.cogs||0,color:'#956515'},{label:'LNST hiện tại',value:a.pat||0}],{diverging:true})}</section><section class="card span5"><h2>Phân tích và hành động</h2>${insights(n)}</section><section class="card span12"><h2>Cơ cấu chi phí</h2>${breakdown?svgBars([['Nhân sự','personnel'],['Vật tư','materials'],['CCDC','tools'],['DVMN','services'],['Năng lượng','energy']].map(z=>({label:z[0],value:a[z[1]]||0}))):'<div class="empty"><b>Chưa có dữ liệu phân rã chi phí</b><br>Nguồn hiện chỉ cung cấp chỉ tiêu tổng cho đơn vị này.</div>'}</section><section class="card span12"><h2>Chi tiết chi phí dự án</h2><p class="sub">Số liệu nguồn Excel theo từng nhóm chi phí trong kỳ ${state.period}</p><div class="detail-cost-grid">${[['Nhân sự','personnel'],['Vật tư tiêu hao','materials'],['Công cụ dụng cụ','tools'],['Dịch vụ mua ngoài','services'],['Năng lượng','energy'],['Tổng giá vốn','cogs']].map(([l,k])=>`<div class="detail-cost-item"><span>${l}</span><b class="${a[k]<0?'neg':''}">${money(a[k]||0)} ${unitLabel()}</b></div>`).join('')}</div></section><section class="card span12 project-metrics-card compact-finance-card"><div class="section-head"><div><h2>Bảng chỉ tiêu cấp tổng</h2><p class="sub">Toàn bộ chỉ tiêu doanh thu, chi phí và lợi nhuận trong một box tập trung</p></div><span class="mini-filter">${esc(E0.parent||'Toàn Công ty')}</span></div><div class="tablewrap compact-matrix project-matrix"><table><thead><tr><th>Chỉ tiêu</th><th class="num">${state.period}</th><th class="num">T5/2026</th><th class="num">Chênh lệch</th></tr></thead><tbody>${rows}</tbody></table></div></section></div>`}
function quality(){let warn=D.validation.warnings.map(x=>`<div class="insight warnbox"><b>Cần xác minh</b>${esc(x)}</div>`).join('');let defs=Object.entries(D.metrics).map(([k,m])=>`<div>${esc(m.label)}</div><div>${esc(m.formula||('Nguồn dòng '+m.row))}</div>`).join('');return pageHead('Chất lượng dữ liệu','Đối soát, cảnh báo và từ điển chỉ tiêu.')+`<div class="kpis">${kpi('Số entity',D.validation.entityCount,{text:'Bao gồm đơn vị và dự án'},'count')}${kpi('Số dự án/cost object',D.validation.projectCount,{text:'Hạ Long và Phú Quốc'},'count')}${kpi('Lỗi đối soát',D.validation.issues.length,{text:D.validation.issues.length?'Cần xử lý':'Các công thức chính đã khớp',cls:D.validation.issues.length?'neg':'pos'},'count')}${kpi('Cảnh báo mapping',D.validation.warnings.length,{text:'Không tự sửa dữ liệu nguồn',cls:'warn'},'count')}</div><div class="grid"><section class="card span6"><h2>Cảnh báo dữ liệu</h2><p class="sub">Các điểm không chặn báo cáo nhưng cần xác nhận nghiệp vụ</p>${warn}</section><section class="card span6"><h2>Metric dictionary</h2><p class="sub">Nguồn hoặc công thức của chỉ tiêu</p><div class="metriclist">${defs}</div></section></div><div class="source">Nguồn: ${esc(D.meta.workbook)} · Sheet: ${esc(D.meta.sheet)}</div>`}
const renderers={overview,pnl,revenue,cost,portfolio,project,quality};function enhanceDataCards(){document.querySelectorAll('.tablewrap table').forEach(table=>{const headers=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());table.querySelectorAll('tbody tr').forEach(row=>{[...row.children].forEach((cell,i)=>{cell.dataset.label=headers[i]||''})})})}function render(){try{$('#pageHost').innerHTML=renderers[state.view]();enhanceDataCards();bind();$('#printContext').textContent=`${state.period} · ${state.entity} · ${unitLabel()}`;all('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));localStorage.setItem('bemFinanceState',JSON.stringify(state))}catch(err){console.error(err);$('#pageHost').innerHTML=`<div class="error"><b>Không thể hiển thị dashboard</b><br>${esc(err.message)}</div>`}}
function bind(){$('#period')?.addEventListener('change',e=>{state.period=e.target.value;render()});$('#entity')?.addEventListener('change',e=>{state.entity=e.target.value;render()});$('#unit')?.addEventListener('change',e=>{state.unit=e.target.value;render()});$('#revenueParent')?.addEventListener('change',e=>{state.revenueParent=e.target.value;render()});$('#costParent')?.addEventListener('change',e=>{state.costParent=e.target.value;render()});$('#costMetric')?.addEventListener('change',e=>{state.costMetric=e.target.value;render()});$('#costMode')?.addEventListener('change',e=>{state.costMode=e.target.value;render()});all('[data-kqkd-period]').forEach(b=>b.addEventListener('click',()=>{state.period=b.dataset.kqkdPeriod;render()}));$('#reset')?.addEventListener('click',()=>{Object.assign(state,{period:'T6/2026',entity:'Toàn Công ty',unit:'billion'});render()});$('#print')?.addEventListener('click',()=>window.print());all('[data-project]').forEach(r=>r.addEventListener('click',()=>{state.project=r.dataset.project;state.view='project';render()}))}
function initNav(){all('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;sidebar.classList.remove('open');render()}));mobileMenu.addEventListener('click',()=>sidebar.classList.toggle('open'));const groups=D.groups;tree.innerHTML=Object.entries(groups).map(([g,ch])=>`<div class="tree"><button class="treehead"><span>${esc(g)}</span><span class="chev">›</span></button><div class="children"><button class="treeitem" data-project="${esc(g)}">Tổng ${esc(g)}</button>${ch.map(n=>`<button class="treeitem" data-project="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('')+['Chi phí chung HO','TTTM Syrena','Central Avenue','Vận hành/Thanh Phú 85ha'].map(n=>`<button class="treeitem" data-project="${esc(n)}">${esc(n)}</button>`).join('');all('.treehead').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));all('.treeitem').forEach(b=>b.addEventListener('click',()=>{state.project=b.dataset.project;state.view='project';sidebar.classList.remove('open');render()}));sideSearch.addEventListener('input',e=>{let q=e.target.value.toLowerCase();all('.treeitem').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));if(q)all('.tree').forEach(t=>t.classList.add('open'))})}
initNav();render();console.info('BIM Finance validation',D.validation)})();
</script></body></html>
